services:
  betmas-id-manager:
    build:
      context: .
    image: betmas-id-manager:local
    container_name: betmas-id-manager
    ports:
      - "8080:8080"
    volumes:
      - betmas-id-manager-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/types"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  betmas-id-manager-data:
