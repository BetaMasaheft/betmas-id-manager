name: CI

# Scope push to main only - a PR branch push would otherwise also fire
# push, double-triggering this workflow and showing a spurious red check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: betmas-id-manager-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: betmas-id-manager:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for healthy
        timeout-minutes: 1
        run: |
          until [ "$(docker inspect -f '{{.State.Health.Status}}' betmas-id-manager)" = "healthy" ]; do
            echo "Still waiting..."
            sleep 2
          done

      - name: Smoke check against the running container
        run: |
          curl -sf http://localhost:8080/types
          curl -sf -X POST http://localhost:8080/ids/works -H 'Content-Type: application/json' -d '{"suffix":"ci"}'

      - name: Concurrency stress test
        run: npm run test:concurrency

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
